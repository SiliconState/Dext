name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/test_install.sh
          sh scripts/install.sh --help >/dev/null
          sh scripts/test_install.sh
      - name: Check Windows PowerShell installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @("scripts/install.ps1", "scripts/test_install.ps1")) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
          }
          & ./scripts/install.ps1 -Help | Out-Null
      - name: Check PowerShell 7 installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("scripts/install.ps1", "scripts/test_install.ps1")) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
          }
          & ./scripts/install.ps1 -Help | Out-Null
      - name: Validate documentation site
        if: runner.os == 'Linux'
        run: python3 scripts/validate_pages.py docs
      - name: Run Clippy
        run: cargo clippy -p dext --all-targets --all-features --locked --no-deps -- -D warnings
      - name: Test Ratatui compatibility patch
        run: cargo test -p ratatui-core --lib --locked
      - name: Compile benchmarks
        if: runner.os == 'Linux'
        run: cargo bench --no-run --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1 -DextBinary ./target/release/dext.exe
      - name: Test PowerShell 7 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1 -DextBinary ./target/release/dext.exe
      - name: Run release tests
        if: runner.os != 'Windows'
        run: cargo test --release --locked
      - name: Run Windows release tests
        if: runner.os == 'Windows'
        run: cargo test --release --locked -- --skip main_tests::fast_bash_command_returns_without_100ms_poll_tail --skip tui_smoke_launches_real_binary_in_conpty_and_restores_terminal
      - name: Run Windows bash fast-path latency test in isolation
        if: runner.os == 'Windows'
        run: cargo test --release --locked main_tests::fast_bash_command_returns_without_100ms_poll_tail -- --exact --nocapture
      - name: Run Windows ConPTY smoke test
        if: runner.os == 'Windows'
        run: cargo test --release --locked --test tui_smoke_windows -- --nocapture
      - name: Run Unix TUI smoke tests
        if: runner.os != 'Windows'
        run: cargo test --release --locked --test tui_smoke -- --nocapture
