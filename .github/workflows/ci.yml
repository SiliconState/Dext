name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p dext --all-targets --all-features --locked --no-deps -- -D warnings
      - name: Test Ratatui compatibility patch
        run: cargo test -p ratatui-core --lib --locked
      - name: Compile benchmarks
        if: runner.os == 'Linux'
        run: cargo bench --no-run --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run release tests
        run: cargo test --release --locked
      - name: Run TUI smoke tests
        if: runner.os != 'Windows'
        run: cargo test --release --locked --test tui_smoke -- --nocapture
