name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          sh -n scripts/test_install.sh
          sh scripts/install.sh --help >/dev/null
          if [[ "$RUNNER_OS" == Linux ]]; then
            sh scripts/test_install.sh
          fi
      - name: Check PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          & ./scripts/install.ps1 -Help | Out-Null
      - name: Validate documentation site
        if: runner.os == 'Linux'
        run: python3 scripts/validate_pages.py docs
      - name: Run Clippy
        run: cargo clippy -p dext --all-targets --all-features --locked --no-deps -- -D warnings
      - name: Test Ratatui compatibility patch
        run: cargo test -p ratatui-core --lib --locked
      - name: Compile benchmarks
        if: runner.os == 'Linux'
        run: cargo bench --no-run --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run release tests
        if: runner.os != 'Windows'
        run: cargo test --release --locked
      - name: Run Windows release tests
        if: runner.os == 'Windows'
        run: cargo test --release --locked -- --skip main_tests::fast_bash_command_returns_without_100ms_poll_tail
      - name: Run Windows bash fast-path latency test in isolation
        if: runner.os == 'Windows'
        run: cargo test --release --locked main_tests::fast_bash_command_returns_without_100ms_poll_tail -- --exact --nocapture
      - name: Run TUI smoke tests
        if: runner.os != 'Windows'
        run: cargo test --release --locked --test tui_smoke -- --nocapture
