version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tui-stack:
        patterns:
          - ratatui
          - ratatui-core
          - tui-markdown
          - crossterm
          - unicode-width
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
