[package]
name = "wolf"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
dotenvy = "0.15"
unicode-width = "=0.2.0"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
ratatui-core = "0.1.0"
tui-markdown = { version = "0.3.7", default-features = false }
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "wolf_bench"
harness = false

[profile.release]
lto = false
codegen-units = 16
strip = "symbols"
